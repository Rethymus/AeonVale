name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.ENABLE_PAGES == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:public-tree .public-tree
      - run: pnpm --dir .public-tree install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir .public-tree governance:readiness
      - run: pnpm --dir .public-tree governance:public
      - run: pnpm --dir .public-tree governance:check
      - run: pnpm --dir .public-tree typecheck
      - run: pnpm --dir .public-tree test tests/unit/github-workflows.test.ts tests/unit/public-readiness-check.test.ts tests/unit/publication-check.test.ts tests/unit/prepare-public-tree.test.ts tests/unit/public-dist-check.test.ts tests/unit/public-content-audit.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:public-tree
      - run: pnpm --dir .public-tree build
        env:
          PUBLIC_BUILD: 'true'
          VITE_BASE_PATH: /AeonVale/
      - run: pnpm --dir .public-tree governance:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .public-tree/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke deployed Pages URL
        run: pnpm test:browser:pages
