name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./package.json'); if (!/^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z.-]+)?$/.test(process.env.INPUT_VERSION) || p.version !== process.env.INPUT_VERSION) process.exit(1)"
          test "$(git tag -l "v${INPUT_VERSION}")" = ""
      - run: pnpm governance:check
      - run: pnpm governance:readiness
      - run: pnpm typecheck
      - run: pnpm content:lint
      - run: pnpm test
      - run: pnpm prepare:public-tree .public-tree
      - run: pnpm --dir .public-tree install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir .public-tree governance:readiness
      - run: pnpm --dir .public-tree governance:public
      - run: pnpm --dir .public-tree governance:check
      - run: pnpm --dir .public-tree test tests/unit/github-workflows.test.ts tests/unit/public-readiness-check.test.ts tests/unit/publication-check.test.ts tests/unit/prepare-public-tree.test.ts tests/unit/public-dist-check.test.ts tests/unit/public-content-audit.test.ts
      - run: pnpm --dir .public-tree build
        env:
          PUBLIC_BUILD: 'true'
          VITE_BASE_PATH: ./
          VITE_BUILD_REVISION: ${{ github.sha }}
      - run: pnpm --dir .public-tree governance:dist
      - run: cd .public-tree/dist && zip -r "../../AeonVale-v${{ inputs.version }}-web.zip" .
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" "AeonVale-v${{ inputs.version }}-web.zip" --generate-notes --title "Aeon Vale v${{ inputs.version }}"
