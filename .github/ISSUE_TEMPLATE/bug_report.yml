name: Bug 报告
description: 报告可复现的游戏或工程问题
title: "fix: "
labels: [bug]
body:
 - type: textarea
 id: description
 attributes:
 label: 问题描述
 validations:
 required: true
 - type: textarea
 id: reproduce
 attributes:
 label: 复现步骤
 placeholder: 请提供 seed、存档版本、操作顺序与出现频率。
 validations:
 required: true
 - type: textarea
 id: expected
 attributes:
 label: 预期行为
 validations:
 required: true
 - type: input
 id: environment
 attributes:
 label: 环境
 placeholder: OS、浏览器及版本
 validations:
 required: true
 - type: textarea
 id: logs
 attributes:
 label: 日志或截图
 description: 请先移除密钥、邮箱、路径等敏感信息。
