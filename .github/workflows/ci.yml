name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm governance:check
      - run: pnpm governance:readiness
      - run: pnpm governance:public
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - name: Validate commits
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Typecheck, tests, build, and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm content:lint
      - run: pnpm test
      - run: pnpm test:replay
      - run: pnpm m5:check
      # 单分支模型：根树即发布源，直接按 Pages 参数构建并校验产物。
      - run: pnpm build
        env:
          PUBLIC_BUILD: 'true'
          VITE_BASE_PATH: /AeonVale/
          VITE_BUILD_REVISION: ${{ github.sha }}
      - run: pnpm governance:dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: aeonvale-pages-dist-${{ github.sha }}
          path: dist
          include-hidden-files: true
          retention-days: 10

  browser-smoke:
    name: Chromium smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 单分支模型：根树即发布源，烟测直接按 Pages 站点参数跑本仓库。
      - run: pnpm governance:readiness
      - run: pnpm governance:public
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:smoke
        env:
          PLAYWRIGHT_GAME_BASE_PATH: /AeonVale/
          PLAYWRIGHT_VITE_BASE_PATH: /AeonVale/
      - run: pnpm test:browser:keypoint
        env:
          PLAYWRIGHT_GAME_BASE_PATH: /AeonVale/
          PLAYWRIGHT_VITE_BASE_PATH: /AeonVale/
      - run: pnpm test:browser:r1-input
        env:
          PLAYWRIGHT_GAME_BASE_PATH: /AeonVale/
          PLAYWRIGHT_VITE_BASE_PATH: /AeonVale/
