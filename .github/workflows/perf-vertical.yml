name: Perf vertical sampling

# 性能纵向采样（docs/32 §24.6.1/§24.7/§24.1）：
# 每周自动对线上站点跑固化工具 pnpm perf:audit（桌面 --loads=3 与移动 --mobile --loads=3），
# 结果追加 docs/perf/vertical-samples.jsonl 并回提交——无人值守的双维度纵向监测。
# 阈值判定只打印不失败（LCP 移动维度按「载荷带宽下限」口径记录，见 §24.6）；
# 回归判定人工对比 §24.6.1/§24.7 的方差带。回提交只动 docs/perf，不在路径过滤内——无自触发循环。

on:
  schedule:
    # 双 cron 互为备份：平台高负载可能丢弃 schedule 事件（2026-09-21 首触发即被丢，
    # docs/32 §24.7.2 验收）；起始守卫步按「feed 已含今日记录」幂等跳过，双触发安全。
    - cron: '23 2 * * 1'
    - cron: '43 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perf-vertical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Skip if today's sample already landed (idempotent guard)
        run: |
          # 浅克隆（checkout 默认 fetch-depth=1）中 origin/main 引用不存在，
          # 须用 FETCH_HEAD（首日部署即因 origin/main 静默失败导致守卫失效、重复采样）。
          git fetch --depth=1 origin main --quiet
          if git show FETCH_HEAD:docs/perf/vertical-samples.jsonl | grep -q "$(date -u +%Y-%m-%d)"; then
            echo "今日样本已在链上——跳过本次触发（双 cron 幂等守卫）。"
            exit 0
          fi
      - name: Desktop vertical sample
        run: pnpm perf:audit --loads=3 --out=docs/perf/vertical-samples.jsonl --bands=docs/perf/vertical-bands.json
      - name: Desktop tribulation frame budget
        run: pnpm perf:audit --loads=1 --flow --out=docs/perf/vertical-samples.jsonl
      - name: Mobile vertical sample (Slow 4G + 4x CPU)
        run: pnpm perf:audit --mobile --loads=3 --out=docs/perf/vertical-samples.jsonl --bands=docs/perf/vertical-bands.json
      - name: Commit samples if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/perf/vertical-samples.jsonl
          if git diff --cached --quiet; then
            echo 'Sampling feed unchanged — no commit.'
            exit 0
          fi
          git commit -m 'chore(perf): 纵向采样入链'
          git pull --rebase origin main
          git push
